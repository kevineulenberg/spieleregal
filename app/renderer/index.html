<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Game Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient" aria-hidden="true"><div class="backdrop a"></div><div class="backdrop b"></div><div class="veil"></div></div>

<header class="bar">
  <div class="brand"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="2" y="7" width="28" height="18" rx="9" fill="currentColor"/><rect x="8" y="14.5" width="7" height="3" rx="1" fill="#0d0a14"/><rect x="10" y="12.5" width="3" height="7" rx="1" fill="#0d0a14"/><circle cx="21" cy="18" r="1.8" fill="#0d0a14"/><circle cx="24.5" cy="14" r="1.8" fill="#0d0a14"/></svg><span>Spieleregal</span></div>
  <label class="search"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Spiel suchen" autocomplete="off" spellcheck="false"></label>
  <div class="bar-actions">
    <button class="btn ghost" id="add"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Spiel hinzufügen</button>
    <button class="icon-btn" id="settings" title="Einstellungen" aria-label="Einstellungen"><svg viewBox="0 0 20 20" width="18" height="18"><path fill="currentColor" d="M11.5 1.5h-3l-.5 2.4a6.5 6.5 0 0 0-1.6.9L4 4 2.500 6.600l1.800 1.700a6.500 6.500 0 0 0 0 1.800L2.500 11.800 4 14.400l2.400-.800a6.500 6.500 0 0 0 1.600.900l.500 2.400h3l.500-2.400a6.500 6.500 0 0 0 1.600-.900l2.400.800 1.500-2.600-1.800-1.700a6.500 6.500 0 0 0 0-1.800l1.800-1.700L16 4l-2.400.8a6.500 6.500 0 0 0-1.600-.9zM10 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg></button>
  </div>
</header>

<main id="scroll">
  <section class="hero" id="hero">
    <div class="hero-text">
      <div class="meta" id="h-meta"></div>
      <h1 id="h-title"></h1>
      <p id="h-desc"></p>
      <div class="hero-actions">
        <button class="btn play" id="h-play"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 3.500v13l11-6.500z" fill="currentColor"/></svg>Spielen</button>
        <button class="btn glass" id="h-details">Details</button>
        <button class="icon-btn glass" id="h-fav" aria-label="Favorit"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 17s-6.500-3.900-6.500-8.600A3.600 3.600 0 0 1 10 6.300a3.600 3.600 0 0 1 6.500 2.100C16.500 13.100 10 17 10 17z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="stats" id="h-stats"></div>
    </div>
    <div class="hero-art" id="h-art"><div class="box" id="h-box"><img id="h-img" alt="" draggable="false"><div class="shine"></div></div></div>
  </section>
  <section class="rows" id="rows"></section>
</main>

<div class="launch" id="launch" hidden><div class="launch-cover"><img alt=""><div class="ring"></div></div><div class="launch-text"><span id="launch-title"></span><small>wird gestartet</small></div></div>
<div class="drop" id="drop" hidden><div><strong>Loslassen zum Hinzufügen</strong><span>Apps, Ordner oder Startdateien</span></div></div>
<div class="menu" id="menu" hidden></div>
<div class="toasts" id="toasts"></div>
<dialog id="sheet" tabindex="-1"></dialog>
<script src="app.js"></script>
</body>
</html>
